<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pausa - Vestiário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            padding: 40px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 1.8rem; }
        p { font-size: 1.1rem; color: #666; margin-bottom: 25px; }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            line-height: 1.4;
        }
        .aguardando { background-color: #e3f2fd; color: #0d47a1; }
        .sucesso { background-color: #e8f5e9; color: #1b5e20; }
        .erro { background-color: #ffebee; color: #b71c1c; }
        button {
            padding: 18px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            background-color: #0078d4;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        button:active { background-color: #005a9e; }
    </style>
</head>
<body>

<div class="container">
    <h1>Controle de Pausa</h1>
    <p>Vestiário Corporativo</p>
    
    <button id="btnIniciar">1. TOQUE AQUI PARA ATIVAR</button>
    <div id="status" class="status aguardando">Clique no botão acima no início do dia.</div>
</div>

<script>
    const btnIniciar = document.getElementById('btnIniciar');
    const statusDiv = document.getElementById('status');

    // ⚠️ SUBSTITUA O LINK ABAIXO PELA URL DO SEU FLUXO NO POWER AUTOMATE
    const WEBHOOK_URL = "https://default651b43ceccb84301b551b04dd872d4.01.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/3b3fbd0c98fa4c91b0b07e2f0c08adfe/triggers/manual/paths/invoke?api-version=1"; 

    btnIniciar.addEventListener('click', async () => {
        if ('NDEFReader' in window) {
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                
                statusDiv.className = "status sucesso";
                statusDiv.innerText = "SISTEMA PRONTO!\n Aproxime o crachá da traseira do celular.";
                btnIniciar.style.display = "none"; // Esconde o botão após ativar no início do dia

                ndef.addEventListener("reading", ({ serialNumber }) => {
                    console.log("Crachá lido:", serialNumber);
                    
                    statusDiv.className = "status aguardando";
                    statusDiv.innerText = `Lendo crachá (${serialNumber})...\nRegistrando no SharePoint...`;

                    enviarParaSharePoint(serialNumber);
                });

            } catch (error) {
                statusDiv.className = "status erro";
                statusDiv.innerText = "Erro ao ativar leitor: " + error;
            }
        } else {
            statusDiv.className = "status erro";
            statusDiv.innerText = "Web NFC não suportado. Abra este link usando o Google Chrome no Android!";
        }
    });

    async function enviarParaSharePoint(nfcId) {
        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nfc_id: nfcId })
            });

            if (response.ok) {
                statusDiv.className = "status sucesso";
                statusDiv.innerText = "✅ PAUSA REGISTRADA!\nPode passar o próximo crachá.";
            } else {
                statusDiv.className = "status erro";
                statusDiv.innerText = "❌ Erro ao salvar no SharePoint. Tente novamente.";
            }
        } catch (err) {
            statusDiv.className = "status erro";
            statusDiv.innerText = "❌ Erro de conexão ao enviar os dados.";
        }
    }
</script>

</body>
</html>
