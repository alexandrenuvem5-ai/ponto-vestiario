<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Vestiário - NFC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            text-align: center;
            padding: 30px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 350px;
        }
        h2 { color: #333; margin-top: 0; }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            line-height: 1.4;
            white-space: pre-line;
        }
        .aguardando { background-color: #e3f2fd; color: #0d47a1; }
        .sucesso { background-color: #e8f5e9; color: #1b5e20; }
        .erro { background-color: #ffebee; color: #b71c1c; }
        button {
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            background-color: #0078d4;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        button:active { background-color: #005a9e; }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro de Pausa</h2>
    <p>Vestiário</p>
    
    <button id="btnAtivar">1. ATIVAR LEITOR NFC</button>
    <div id="status" class="status aguardando">Toque no botão acima para iniciar o leitor.</div>
</div>

<script>
    // ⚠️ SUBSTITUA O TEXTO ABAIXO PELA SUA URL DO POWER AUTOMATE MANTENDO AS ASPAS
    const WEBHOOK_URL = "SUA_URL_DO_POWER_AUTOMATE_AQUI"; 

    const btnAtivar = document.getElementById('btnAtivar');
    const statusDiv = document.getElementById('status');

    btnAtivar.addEventListener('click', async () => {
        if ('NDEFReader' in window) {
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                
                statusDiv.className = "status sucesso";
                statusDiv.innerText = "✅ LEITOR ATIVO!\nAproxime o crachá da traseira do celular.";
                btnAtivar.style.display = "none";

                ndef.addEventListener("reading", ({ serialNumber }) => {
                    statusDiv.className = "status aguardando";
                    statusDiv.innerText = `Lendo crachá (${serialNumber})...\nEnviando dados...`;

                    registrarPausa(serialNumber);
                });

            } catch (error) {
                statusDiv.className = "status erro";
                statusDiv.innerText = "Erro ao ativar o leitor: " + error;
            }
        } else {
            statusDiv.className = "status erro";
            statusDiv.innerText = "NFC não suportado!\nAbra este link no Google Chrome do Android.";
        }
    });

    async function registrarPausa(nfcId) {
        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors', // Evita o bloqueio de segurança CORS no navegador
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ nfc_id: nfcId })
            });

            statusDiv.className = "status sucesso";
            statusDiv.innerText = "✅ REGISTRO ENVIADO!\nPode passar o próximo crachá.";

            // Reseta a mensagem na tela após 3 segundos
            setTimeout(() => {
                statusDiv.className = "status sucesso";
                statusDiv.innerText = "✅ LEITOR ATIVO!\nAproxime o crachá da traseira do celular.";
            }, 3000);

        } catch (err) {
            statusDiv.className = "status erro";
            statusDiv.innerText = "❌ Erro de conexão com o servidor: " + err;
        }
    }
</script>

</body>
</html>
